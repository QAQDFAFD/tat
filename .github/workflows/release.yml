name: Release

# Push a tag like `v0.2.0` to build, test and publish a GitHub Release with .dmg and .zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # build number = commit count

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Tat.xcodeproj -scheme TatUnit -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            | xcbeautify --renderer github-actions

      - name: Build universal app, .zip and .dmg
        run: scripts/build-release.sh "${TAG#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(cat <<EOF
          ## 安装

          1. 下载 \`tat-${VERSION}.dmg\`，把 tat 拖进「应用程序」。
          2. 应用未经 Apple 公证，首次打开前在终端执行一次：
             \`xattr -dr com.apple.quarantine /Applications/tat.app\`
          3. 打开后菜单栏出现 tat 图标；鼠标移到屏幕最右侧即可呼出面板，或按 ⌥⌘T。

          校验：见 \`SHA256SUMS.txt\`。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "tat ${VERSION}" --notes "$NOTES" --generate-notes
          fi
