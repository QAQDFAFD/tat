name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail, so `xcodebuild | xcbeautify` fails when tests fail

jobs:
  test:
    name: Build & test (unit + e2e)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Tat.xcodeproj -scheme TatUnit -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData -resultBundlePath build/unit.xcresult \
            | xcbeautify --renderer github-actions

      - name: End-to-end UI tests
        run: |
          xcodebuild test \
            -project Tat.xcodeproj -scheme Tat -destination 'platform=macOS' \
            -only-testing:TatUITests \
            -derivedDataPath build/DerivedData -resultBundlePath build/e2e.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/*.xcresult
          retention-days: 14
